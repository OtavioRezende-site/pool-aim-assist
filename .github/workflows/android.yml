name: Android Debug
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar SDK Android 35
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$manager" ]; then
              echo "::error::SDK Android sem sdkmanager em $manager"
              exit 1
            fi
            "$manager" "platforms;android-35" "build-tools;35.0.0" || {
              echo "::error::Não foi possível preparar o SDK Android 35 no runner"
              exit 1
            }
          fi
      - name: Testes, APK debug e lint
        run: ./gradlew --no-daemon :physics:test :vision-api:test :recognition:test :app:assembleDebug :app:lintDebug
      - name: Preparar pacote instalável
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Pool-Aim-Assist-debug.apk
          cp docs/INSTALLATION.md dist/LEIA-ME.md
      - name: Calcular SHA-256
        working-directory: dist
        run: sha256sum Pool-Aim-Assist-debug.apk > SHA256SUMS
      - name: Publicar APK em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pool-Aim-Assist-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publicar relatórios de build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            physics/build/reports/tests/
            vision-api/build/reports/tests/
            recognition/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testes instrumentados Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Resumir resultados instrumentados
        if: always()
        run: python3 .github/scripts/report-device-tests.py
      - name: Publicar relatórios do dispositivo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
